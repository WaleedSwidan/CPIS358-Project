<!DOCTYPE html>
<html lang="en">

<head>
    <!-- utf-8 so arabic text shows correctly -->
    <meta charset="UTF-8">

    <meta name="description" content="Uddah - Rent tools and equipment by the day">
    <meta name="keywords" content="Uddah, tool rental, equipment rental, daily rent">

    <title>Uddah - Login</title>

    <!-- main css file, same one for all pages -->
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

    <!-- header: same on every page. the whole logo is an image map that opens the About page -->
    <header class="site-header">
        <img src="images/logo.png" alt="Uddah - Daily tool rental"
             width="250" height="150" usemap="#uddah-map">

        <map name="uddah-map">
            <area shape="rect" coords="0,0,250,150" href="about.html" alt="About Uddah">
        </map>
    </header>

    <!-- menu: same on every page. "More" opens a drop-down with Contact, Feedback and Policy -->
    <nav class="main-menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Us</a></li>

            <li>
                <a href="#">More &#9662;</a>
                <ul>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="feedback.html">Feedback</a></li>
                    <li><a href="policy.html">Policy</a></li>
                </ul>
            </li>

            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
        </ul>
    </nav>

    <!-- page content starts here -->
    <section id="content" class="content">
        <h2>Login</h2>
        <p>Welcome back! Log in to rent the tools you need.</p>

        <!-- login form. form-box gives it the white card style (same as the other forms) -->
        <form method="post" action="#" class="form-box">

            <!-- type email checks the @ by itself, no javascript needed -->
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="name@example.com" required autofocus>
            </p>

            <!-- type password hides what the user types -->
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <input type="checkbox" id="remember" name="remember" value="yes">
                <label for="remember">Remember me</label>
            </p>

            <!-- btn is our button class from style.css -->
            <p>
                <input type="submit" value="Login" class="btn">
                <input type="reset" value="Clear" class="btn">
            </p>
        </form>

        <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    </section>

    <!-- footer: same on every page -->
    <footer class="site-footer">
        <p>&copy; 2026 Uddah. All rights reserved.</p>
    </footer>

</body>
</html>
